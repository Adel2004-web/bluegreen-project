events {}
http {
  include /etc/nginx/conf.d/*.conf;   # contient l'upstream actif (blue ou green)

  server {
    listen 80;
    location /metrics { return 404; }  # non exposé publiquement
    location / {
      proxy_pass http://app_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
