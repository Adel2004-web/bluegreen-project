services:
  app-blue:
    build:
      context: ./app
    container_name: app-blue
    image: bluegreen-app:${BLUE_VERSION:-dev}
    environment:
      - APP_COLOR=blue
      - APP_VERSION=${BLUE_VERSION:-dev}
    restart: unless-stopped
    healthcheck: &hc
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app-green:
    build:
      context: ./app
    container_name: app-green
    image: bluegreen-app:${GREEN_VERSION:-dev}
    environment:
      - APP_COLOR=green
      - APP_VERSION=${GREEN_VERSION:-dev}
    restart: unless-stopped
    healthcheck: *hc

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports: ["3001:3000"]
    volumes: ["./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    restart: unless-stopped
